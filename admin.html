<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Studio Admin — The Blush Makeover</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Poppins:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css" />
</head>
<body class="admin-page">

<nav class="admin-nav">
  <span class="logo"><span class="mark"></span>The Blush Makeover</span>
  <a class="nav-link" href="index.html">← Back to homepage</a>
</nav>

<main class="admin-main">
  <h1>Studio admin</h1>
  <p class="sub">Everything happening across the site — accounts, bookings and sign-in activity.</p>

  <div class="admin-panel">
    <h2>Customer accounts <span id="account-count" class="count"></span></h2>
    <table id="accounts-table">
      <thead><tr><th>Name</th><th>Joined</th><th></th></tr></thead>
      <tbody id="accounts-body"></tbody>
    </table>
    <p id="accounts-empty" class="empty" hidden>No accounts yet.</p>
  </div>

  <div class="admin-panel">
    <h2>Bookings <span id="booking-count" class="count"></span></h2>
    <table id="bookings-table">
      <thead><tr><th>Customer</th><th>Service</th><th>Date</th><th>Requested</th></tr></thead>
      <tbody id="bookings-body"></tbody>
    </table>
    <p id="bookings-empty" class="empty" hidden>No bookings yet.</p>
  </div>

  <div class="admin-panel">
    <div class="panel-head-row">
      <h2>Activity log <span id="log-count" class="count"></span></h2>
      <div style="display:flex; gap:8px;">
        <button id="seed-demo" class="ghost small" type="button">Load sample activity</button>
        <button id="clear-logs" class="ghost small" type="button">Clear log</button>
      </div>
    </div>
    <ul id="log-list" class="log-list"></ul>
    <p id="log-empty" class="empty" hidden>No activity yet.</p>
  </div>
</main>

<script src="app.js"></script>
</body>
</html>
